name: Deploy web version to GitHub Pages

# Only publish docs/ on a tagged release, never on an ordinary push to main.
# This requires the repo's Settings > Pages > Build and deployment > Source
# to be set to "GitHub Actions" (not "Deploy from a branch") — otherwise
# GitHub's own branch-based Pages deploy still fires on every push.
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
