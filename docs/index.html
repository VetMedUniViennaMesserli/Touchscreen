<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Touchscreen Learning Tasks</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      font-family: system-ui, sans-serif;
      background: #1a1a1a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    main { max-width: 480px; width: 100%; }
    h1 { font-size: 28px; margin-bottom: 24px; }
    ul { list-style: none; display: flex; flex-direction: column; gap: 14px; }
    a.app-link {
      display: block;
      padding: 18px 22px;
      background: #111;
      border: 2px solid #333;
      border-radius: 10px;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      transition: border-color 0.15s;
    }
    a.app-link:hover { border-color: #1a7a4a; }
  </style>
</head>
<body>
  <main>
    <h1>Touchscreen Learning Tasks</h1>
    <ul>
      <li><a class="app-link" href="RuleLearning/">Rule Learning</a></li>
    </ul>
  </main>
</body>
</html>
